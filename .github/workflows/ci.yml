name: CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run build (TypeScript & Vite)
        run: bun run build
        env:
          VITE_BASE_URL: /STUDY_AI-/

  backend-validate:
    name: .NET 10 Backend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Ephemeral Secrets & Start SQL Server Container
        run: |
          # 1. Generate cryptographically strong ephemeral secrets for this run
          SA_PASS="StudyAI_$(openssl rand -hex 8)_A1!"
          JWT_KEY="ci_ephemeral_$(openssl rand -hex 16)_jwt_key"
          
          # 2. Mask secrets from all runner logs
          echo "::add-mask::$SA_PASS"
          echo "::add-mask::$JWT_KEY"
          
          # 3. Export to environment for subsequent steps
          echo "MSSQL_SA_PASSWORD=$SA_PASS" >> $GITHUB_ENV
          echo "CI_JWT_KEY=$JWT_KEY" >> $GITHUB_ENV
          
          # 4. Start SQL Server 2022 container with ephemeral password
          docker run -d \
            --name mssql-ci \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=$SA_PASS" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server Health Check
        run: |
          echo "Verifying SQL Server container readiness..."
          for i in {1..30}; do
            if docker exec mssql-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is healthy and ready to accept connections."
              exit 0
            fi
            echo "Waiting for SQL Server ($i/30)..."
            sleep 2
          done
          echo "ERROR: Timed out waiting for SQL Server container."
          exit 1

      - name: Restore dependencies
        run: dotnet restore StudyAI.sln

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release StudyAI.sln

      - name: Run .NET Unit Tests
        run: dotnet test --no-build --configuration Release tests/StudyAI.UnitTests/StudyAI.UnitTests.csproj --verbosity normal

      - name: Run .NET Integration Tests (Real SQL Server)
        run: dotnet test --no-build --configuration Release tests/StudyAI.IntegrationTests/StudyAI.IntegrationTests.csproj --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=StudyAIDb;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=true;"
          Jwt__SecretKey: ${{ env.CI_JWT_KEY }}

      - name: Teardown SQL Server Container
        if: always()
        run: |
          docker stop mssql-ci || true
          docker rm mssql-ci || true
