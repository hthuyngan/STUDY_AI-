name: CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run build (TypeScript & Vite)
        run: bun run build
        env:
          VITE_BASE_URL: /STUDY_AI-/

  backend-validate:
    name: .NET 10 Backend Build & Tests (Isolated Run ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Ephemeral Secrets & Start SQL Server Container
        run: |
          SA_PASS="StudyAI_$(openssl rand -hex 8)_A1!"
          JWT_KEY="ci_ephemeral_$(openssl rand -hex 16)_jwt_key"
          echo "::add-mask::$SA_PASS"
          echo "::add-mask::$JWT_KEY"
          echo "MSSQL_SA_PASSWORD=$SA_PASS" >> $GITHUB_ENV
          echo "CI_JWT_KEY=$JWT_KEY" >> $GITHUB_ENV
          docker run -d \
            --name mssql-ci \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=$SA_PASS" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server Health Check & Pre-create Disposable Test Database
        run: |
          CLEAN_DB="StudyAIDb_Clean_$(openssl rand -hex 16)"
          echo "CI_CLEAN_DB=$CLEAN_DB" >> $GITHUB_ENV
          echo "Verifying SQL Server container readiness..."
          for i in {1..30}; do
            if docker exec mssql-ci /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\")" > /dev/null 2>&1; then
              echo "SQL Server is healthy and ready to accept connections."
              docker exec mssql-ci /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -Q \"CREATE DATABASE [$CLEAN_DB];\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -Q \"CREATE DATABASE [$CLEAN_DB];\")"
              echo "Disposable test database $CLEAN_DB created successfully."
              exit 0
            fi
            echo "Waiting for SQL Server ($i/30)..."
            sleep 2
          done
          echo "ERROR: Timed out waiting for SQL Server container."
          exit 1

      - name: Restore dependencies
        run: dotnet restore StudyAI.sln

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release StudyAI.sln

      - name: Run .NET Unit Tests
        run: dotnet test --no-build --configuration Release tests/StudyAI.UnitTests/StudyAI.UnitTests.csproj --verbosity normal

      - name: Run .NET Integration Tests (Real SQL Server Disposable DB)
        id: integration_tests
        run: dotnet test --no-build --configuration Release tests/StudyAI.IntegrationTests/StudyAI.IntegrationTests.csproj --verbosity normal --logger "trx;LogFileName=integration-run-${{ matrix.run }}.trx"
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=${{ env.CI_CLEAN_DB }};User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
          Jwt__SecretKey: ${{ env.CI_JWT_KEY }}

      - name: Cleanup & Verify Disposable Database Removed
        if: always()
        id: db_cleanup
        run: |
          set -euo pipefail
          docker exec mssql-ci /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -b -Q \"IF DB_ID('${{ env.CI_CLEAN_DB }}') IS NOT NULL BEGIN ALTER DATABASE [${{ env.CI_CLEAN_DB }}] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [${{ env.CI_CLEAN_DB }}]; END\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -b -Q \"IF DB_ID('${{ env.CI_CLEAN_DB }}') IS NOT NULL BEGIN ALTER DATABASE [${{ env.CI_CLEAN_DB }}] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [${{ env.CI_CLEAN_DB }}]; END\")"
          REMAINING=$(docker exec mssql-ci /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -h -1 -W -Q \"SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = '${{ env.CI_CLEAN_DB }}';\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -h -1 -W -Q \"SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = '${{ env.CI_CLEAN_DB }}';\")" | tr -d '[:space:]')
          echo "Remaining count for ${{ env.CI_CLEAN_DB }}: $REMAINING"
          if [[ "$REMAINING" != "0" ]]; then
            echo "ERROR: Disposable database ${{ env.CI_CLEAN_DB }} was not removed!"
            exit 1
          fi
          mkdir -p ci-evidence
          cat <<EOF > ci-evidence/ci-evidence-run-${{ matrix.run }}.json
          {
            "runNumber": ${{ matrix.run }},
            "commitSha": "${{ github.sha }}",
            "sanitizedDatabaseName": "${{ env.CI_CLEAN_DB }}",
            "migrationResult": "applied-via-StudyAIApiFixture",
            "integrationTestOutcome": "${{ steps.integration_tests.outcome }}",
            "cleanupOutcome": "verified-dropped",
            "remainingRunDatabasesCount": 0
          }
          EOF

      - name: Upload Durable CI Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env01-ci-evidence-run-${{ matrix.run }}
          path: |
            backend/ci-evidence/ci-evidence-run-${{ matrix.run }}.json
            backend/tests/StudyAI.IntegrationTests/TestResults/integration-run-${{ matrix.run }}.trx

      - name: Teardown SQL Server Container
        if: always()
        run: |
          docker stop mssql-ci || true
          docker rm mssql-ci || true

  playwright-e2e:
    name: P02 Playwright E2E (Real SQL Server Disposable DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, backend-validate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Root & Frontend Dependencies + Playwright Chromium
        env:
          VITE_BASE_URL: /
        run: |
          bun install --frozen-lockfile
          (cd frontend && bun install --frozen-lockfile && bun run build)
          bunx playwright install chromium --with-deps

      - name: Restore & Build Backend
        working-directory: backend
        run: |
          dotnet restore StudyAI.sln
          dotnet build --no-restore StudyAI.sln

      - name: Start Ephemeral SQL Server Container
        run: |
          SA_PASS="StudyAI_$(openssl rand -hex 8)_A1!"
          JWT_KEY="ci_ephemeral_$(openssl rand -hex 16)_jwt_key"
          CLEAN_DB="StudyAIDb_Clean_$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASS"
          echo "::add-mask::$JWT_KEY"
          echo "MSSQL_SA_PASSWORD=$SA_PASS" >> $GITHUB_ENV
          echo "CI_JWT_KEY=$JWT_KEY" >> $GITHUB_ENV
          echo "CI_CLEAN_DB=$CLEAN_DB" >> $GITHUB_ENV
          docker run -d \
            --name mssql-e2e \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=$SA_PASS" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..30}; do
            if docker exec mssql-e2e /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\")" > /dev/null 2>&1; then
              docker exec mssql-e2e /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -Q \"CREATE DATABASE [$CLEAN_DB];\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -Q \"CREATE DATABASE [$CLEAN_DB];\")"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Timed out waiting for SQL Server container."
          exit 1

      - name: Run P02, P03, P04 & P05 Playwright E2E
        run: |
          bun scripts/e2e_p02_curriculum_workspace_playwright.ts
          bun scripts/e2e_p03_lesson_composition_playwright.ts
          bun scripts/e2e_p04_lesson_resources_playwright.ts
          bun scripts/e2e_p05_question_assessment_playwright.ts
        env:
          VITE_BASE_URL: /
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=${{ env.CI_CLEAN_DB }};User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
          Jwt__SecretKey: ${{ env.CI_JWT_KEY }}

      - name: Upload P02 Visual QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-playwright-visual-qa
          path: docs/visual-qa/p02/

      - name: Teardown SQL Server Container
        if: always()
        run: |
          docker stop mssql-e2e || true
          docker rm mssql-e2e || true
