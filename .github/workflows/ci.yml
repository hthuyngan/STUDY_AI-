name: CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run build (TypeScript & Vite)
        run: bun run build
        env:
          VITE_BASE_URL: /STUDY_AI-/

  backend-validate:
    name: .NET 10 Backend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrongPassword!2026'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrongPassword!2026 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore StudyAI.sln

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release StudyAI.sln

      - name: Run .NET Unit Tests
        run: dotnet test --no-build --configuration Release tests/StudyAI.UnitTests/StudyAI.UnitTests.csproj --verbosity normal

      - name: Run .NET Integration Tests (Real SQL Server)
        run: dotnet test --no-build --configuration Release tests/StudyAI.IntegrationTests/StudyAI.IntegrationTests.csproj --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=StudyAIDb;User Id=sa;Password=YourStrongPassword!2026;TrustServerCertificate=True;MultipleActiveResultSets=true;"
          Jwt__SecretKey: "github_actions_ci_secret_key_with_at_least_32_characters_ok!"
