name: Safe Agent Bridge CI

on:
  push:
    branches:
      - feature/safe-agent-orchestration
    paths:
      - 'scripts/agents/**'
      - 'docs/agents/**'
      - '.github/workflows/safe-agent-bridge.yml'
  pull_request:
    branches:
      - feature/backend-redesign-modular-monolith
      - main
    paths:
      - 'scripts/agents/**'
      - 'docs/agents/**'
      - '.github/workflows/safe-agent-bridge.yml'
  workflow_dispatch:

jobs:
  bridge-security-tests:
    name: Bridge Guardrails (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - powershell
          - pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run hermetic Safe Agent Bridge & Adversarial suites
        shell: ${{ matrix.shell }}
        run: |
          $cleanTemp = Join-Path $env:RUNNER_TEMP ("bridge-ci-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $cleanTemp -Force | Out-Null
          $env:TEMP = $cleanTemp
          $env:TMP = $cleanTemp
          ./scripts/agents/Test-SafeAgentBridge.ps1 -SkipLiveCodex
          ./scripts/agents/Test-SafeAgentAdversarial.ps1
