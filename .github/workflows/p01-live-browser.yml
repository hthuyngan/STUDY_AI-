name: P01 Live Browser Acceptance (Isolated SQL)

on:
  push:
    branches:
      - feature/math10-12-p00-foundation
      - feature/math10-12-integrated-learner-ai-fullstack
  pull_request:
    branches:
      - feature/math10-12-p00-foundation
  workflow_dispatch:

concurrency:
  group: p01-live-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-browser:
    name: Real browser - ASP.NET - Disposable StudyAIDb_Clean_GUID
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_FRONTEND_URL: http://127.0.0.1:5174
      E2E_BACKEND_URL: http://127.0.0.1:8000
      E2E_ADMIN_EMAIL: admin@studyai.internal
      E2E_ADMIN_PASSWORD: Admin@123456
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Start disposable SQL Server container and export ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          SA_PASS="StudyAI_$(openssl rand -hex 8)_A1!"
          JWT_KEY="ci_ephemeral_$(openssl rand -hex 16)_jwt_key"
          CLEAN_DB="StudyAIDb_Clean_$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASS"
          echo "::add-mask::$JWT_KEY"
          echo "MSSQL_SA_PASSWORD=$SA_PASS" >> "$GITHUB_ENV"
          echo "Jwt__SecretKey=$JWT_KEY" >> "$GITHUB_ENV"
          echo "E2E_DB_NAME=$CLEAN_DB" >> "$GITHUB_ENV"
          echo "ConnectionStrings__DefaultConnection=Server=127.0.0.1,1433;Database=$CLEAN_DB;User Id=sa;Password=$SA_PASS;TrustServerCertificate=True;" >> "$GITHUB_ENV"
          docker run -d --name mssql-p01-live -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASS" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL and create ONLY disposable StudyAIDb_Clean_GUID
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..45}; do
            if docker exec mssql-p01-live /bin/bash -c '(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1")' >/dev/null 2>&1; then
              docker exec mssql-p01-live /bin/bash -c "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -C -Q \"CREATE DATABASE [$E2E_DB_NAME]\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"\$MSSQL_SA_PASSWORD\" -Q \"CREATE DATABASE [$E2E_DB_NAME]\")"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server not ready"; exit 1

      - name: Build backend and seed ONLY isolated E2E SQL through protected integration fixture
        run: |
          set -euo pipefail
          dotnet restore backend/StudyAI.sln
          dotnet build backend/StudyAI.sln -c Release --no-restore
          dotnet test backend/tests/StudyAI.IntegrationTests/StudyAI.IntegrationTests.csproj -c Release --no-build --filter "FullyQualifiedName~LiveE2E_SettingsConcurrentPuts_OnlyOneWriteCanWin" --logger "console;verbosity=normal"

      - name: Install frontend dependencies and build local-base app
        run: |
          bun install
          cd frontend
          bun install --frozen-lockfile
          VITE_BASE_URL=/ VITE_BACKEND_URL=http://127.0.0.1:8000 bun run build

      - name: Install headless Chromium
        run: bunx playwright install chromium

      - name: Start real API and real Vite preview
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --no-launch-profile -c Release --project backend/src/StudyAI.Api/StudyAI.Api.csproj --urls http://127.0.0.1:8000 > /tmp/p01-api.log 2>&1 &
          echo $! > /tmp/p01-api.pid
          (cd frontend && VITE_BASE_URL=/ VITE_BACKEND_URL=http://127.0.0.1:8000 bunx vite preview --host 127.0.0.1 --port 5174 --strictPort) > /tmp/p01-vite.log 2>&1 &
          echo $! > /tmp/p01-vite.pid
          for i in {1..60}; do
            api_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/auth/refresh || true)
            ui_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5174/login || true)
            if [[ "$api_code" != "000" && "$api_code" != "404" && "$ui_code" == "200" ]]; then
              echo "Real API and Vite preview are up; test DB is StudyAIDb_E2E"
              exit 0
            fi
            sleep 2
          done
          echo "API or browser frontend unavailable"; tail -80 /tmp/p01-api.log; tail -80 /tmp/p01-vite.log; exit 1

      - name: Execute real browser Settings and Teacher acceptance scenarios
        run: bun run test:e2e:p01:live

      - name: Upload browser screenshots and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-live-browser-evidence
          path: |
            docs/visual-qa/p01-live-browser/
            /tmp/p01-api.log
            /tmp/p01-vite.log
          if-no-files-found: warn

      - name: Stop ephemeral backend and SQL
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/p01-api.pid ]]; then kill "$(cat /tmp/p01-api.pid)" || true; fi
          if [[ -f /tmp/p01-vite.pid ]]; then kill "$(cat /tmp/p01-vite.pid)" || true; fi
          docker rm -f mssql-p01-live || true
